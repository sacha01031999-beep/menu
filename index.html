<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин 3D Іграшок</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0b0f17;
      --bg-card: rgba(22, 30, 46, 0.7);
      --bg-card-hover: rgba(30, 41, 59, 0.9);
      --accent-blue: #38bdf8;
      --accent-purple: #818cf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(56, 189, 248, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(129, 140, 248, 0.05) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* Header */
    header {
      background: rgba(11, 15, 23, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.2rem;
      border-bottom: 1px solid var(--border-color);
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .search-bar { flex: 1 1 100%; order: 3; }

    .search-bar input {
      width: 100%;
      padding: 0.65rem 1.1rem;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: rgba(22, 30, 46, 0.6);
      color: var(--text-main);
      outline: none;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .search-bar input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    .nav-buttons { display: flex; gap: 8px; order: 2; }

    .btn {
      padding: 0.55rem 1rem;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .cart-btn {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
    }

    .admin-toggle-btn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .admin-toggle-btn.active {
      background: rgba(34, 197, 94, 0.15);
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    @media (min-width: 640px) {
      header { padding: 1rem 2rem; }
      .search-bar { flex: 0 1 300px; order: 2; }
      .nav-buttons { order: 3; }
      .btn { padding: 0.6rem 1.2rem; font-size: 0.95rem; }
    }

    /* Admin Panel */
    .admin-panel {
      background: rgba(22, 30, 46, 0.85);
      backdrop-filter: blur(16px);
      margin: 1.2rem auto;
      max-width: 1200px;
      padding: 1.5rem;
      border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      width: 92%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border-color);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .form-grid input {
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: rgba(11, 15, 23, 0.7);
      color: white;
      outline: none;
    }

    .form-grid input:focus { border-color: var(--accent-blue); }

    .dropzone {
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 1.2rem;
      text-align: center;
      cursor: pointer;
      background: rgba(11, 15, 23, 0.4);
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .dropzone:hover { border-color: var(--accent-blue); background: rgba(56, 189, 248, 0.05); }

    .img-preview {
      max-height: 120px;
      margin-top: 10px;
      border-radius: 8px;
      display: none;
    }

    .add-btn {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: white;
      width: 100%;
      padding: 0.8rem;
      border-radius: 10px;
      font-size: 1rem;
    }

    /* Catalog */
    .container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
    .page-title { margin-bottom: 1.2rem; font-size: 1.6rem; font-weight: 700; }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    .product-card {
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
    }

    .card-img-wrapper {
      height: 220px;
      background: rgba(11, 15, 23, 0.8);
      overflow: hidden;
      position: relative;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .product-card:hover .card-img-wrapper img { transform: scale(1.05); }

    .card-body { padding: 1.1rem; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 1.15rem; margin-bottom: 0.4rem; font-weight: 600; }
    .card-desc { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 1rem; flex-grow: 1; line-height: 1.4; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    .card-price { font-size: 1.25rem; font-weight: 700; color: var(--accent-blue); }

    .buy-btn {
      background: linear-gradient(135deg, var(--accent-blue), #0284c7);
      color: white;
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
    }

    .admin-card-actions {
      display: flex; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border-color);
    }

    .edit-btn { background: rgba(245, 158, 11, 0.2); color: var(--accent-amber); border: 1px solid var(--accent-amber); flex: 1; }
    .delete-btn { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); flex: 1; }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center;
      z-index: 200;
    }

    .modal {
      background: #161e2e;
      width: 92%; max-width: 520px;
      border-radius: 20px; padding: 1.5rem;
      max-height: 90vh; overflow-y: auto;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.6rem; cursor: pointer; }

    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.8rem 0; border-bottom: 1px solid var(--border-color);
    }

    .cart-item-controls { display: flex; align-items: center; gap: 8px; }
    .cart-item-controls button {
      background: rgba(255, 255, 255, 0.1);
      color: white; border: none; width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
    }

    .cart-item-controls .remove-btn { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }

    .order-form { display: flex; flex-direction: column; gap: 10px; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color); }
    .order-form input, .order-form textarea {
      padding: 0.7rem; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(11, 15, 23, 0.7); color: white; outline: none;
    }

    .checkout-btn {
      background: linear-gradient(135deg, var(--accent-green), #16a34a);
      color: white; padding: 0.8rem; border-radius: 10px; font-weight: 700; cursor: pointer; border: none;
    }

    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: rgba(22, 30, 46, 0.95); border: 1px solid var(--accent-blue);
      color: white; padding: 0.8rem 1.2rem; border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      z-index: 300; display: none; transition: all 0.3s;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🧊 3D Toys Store</div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Пошук 3D іграшок..." oninput="renderProducts()">
    </div>
    <div class="nav-buttons">
      <button class="btn cart-btn" onclick="toggleCart()">🛒 Кошик (<span id="cartCount">0</span>)</button>
      <button class="btn admin-toggle-btn" id="adminAuthBtn" onclick="toggleAdminAuth()">🔑 Адмін</button>
    </div>
  </header>

  <!-- Панель Адміністратора -->
  <div class="admin-panel" id="adminPanel" style="display: none;">
    <div class="admin-header">
      <h2>⚙️ Панель Адміністратора</h2>
      <button class="btn delete-btn" onclick="logoutAdmin()">Вийти</button>
    </div>
    
    <div class="add-product-form">
      <h3>Додати новий товар</h3>
      <br>
      <div class="form-grid">
        <input type="text" id="prodName" placeholder="Назва іграшки">
        <input type="number" id="prodPrice" placeholder="Ціна (грн)">
        <input type="text" id="prodDesc" placeholder="Опис товару">
        <input type="text" id="prodImg" placeholder="URL фото (необов'язково)">
      </div>

      <div class="dropzone" onclick="document.getElementById('prodFile').click()">
        📁 Натисніть або перетягніть фото з пристрою
        <input type="file" id="prodFile" accept="image/*" style="display: none;" onchange="handleFileUpload(event)">
        <br>
        <img id="imgPreview" class="img-preview" src="" alt="Прев'ю">
      </div>

      <button class="btn add-btn" id="addProdBtn" onclick="addNewProduct()">+ Додати іграшку у каталог</button>
    </div>
  </div>

  <!-- Каталог -->
  <main class="container">
    <h1 class="page-title">Каталог 3D Іграшок</h1>
    <div class="products-grid" id="productsGrid">
      <p style="color: var(--text-muted); text-align: center; grid-column: 1/-1; padding: 2rem;">Завантаження товарів з бази...</p>
    </div>
  </main>

  <!-- Модалка кошика -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal">
      <div class="modal-header">
        <h2>🛍️ Ваш Кошик</h2>
        <button class="close-btn" onclick="toggleCart()">&times;</button>
      </div>
      <div id="cartItems"></div>
      <div class="cart-footer">
        <div style="font-size: 1.2rem; font-weight: 700; text-align: right; margin: 1rem 0;">
          Всього: <span id="cartTotalSum" style="color: var(--accent-blue);">0</span> грн
        </div>
        
        <form id="orderForm" onsubmit="sendOrderToTelegram(event)" class="order-form">
          <h3>Оформлення замовлення</h3>
          <input type="text" id="custName" placeholder="Ваше ім'я" required>
          <input type="tel" id="custPhone" placeholder="Номер телефону" required>
          <input type="text" id="custContact" placeholder="Telegram або Viber (@username)">
          <textarea id="custNote" placeholder="Коментар чи бажані кольори" rows="2"></textarea>
          
          <button type="submit" class="checkout-btn" id="submitOrderBtn">Надіслати замовлення</button>
        </form>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Повідомлення</div>

  <script>
    const TELEGRAM_BOT_TOKEN = '8950609195:AAHKexvKK-aBz0a0Hp7mijJh0JGG6NbWATU';
    const TELEGRAM_CHAT_ID = '5171882196';
    const ADMIN_PASSWORD = 'sasha_top100';

    // Firebase Database URL
    const FIREBASE_DB_URL = 'https://toys-store-b6960-default-rtdb.firebaseio.com/products';

    const defaultProducts = {
      p1: { id: 'p1', title: 'Рухомий 3D Дракон', price: 350, desc: 'Гнучка деталізована фігурка з шовкового PLA пластику.', image: 'https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=600&q=80' },
      p2: { id: 'p2', title: '3D Головоломка Куб', price: 200, desc: 'Цікава антистрес головоломка для розвитку моторики.', image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80' },
      p3: { id: 'p3', title: 'Забавний 3D Робот', price: 280, desc: 'Яскрава іграшка-робот із рухомими кінцівками.', image: 'https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=600&q=80' }
    };

    let productsMap = {};
    let cart = JSON.parse(localStorage.getItem('3d_toys_cart')) || [];
    let isAdmin = localStorage.getItem('3d_toys_is_admin') === 'true';
    let tempUploadedImage = '';

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function saveCart() { 
      localStorage.setItem('3d_toys_cart', JSON.stringify(cart)); 
      updateCartBadge(); 
    }

    // =========================================================
    // РОБОТА З FIREBASE REALTIME DATABASE
    // =========================================================
    async function fetchProductsFromFirebase() {
      try {
        const response = await fetch(`${FIREBASE_DB_URL}.json`);
        const data = await response.json();
        
        if (data) {
          productsMap = data;
        } else {
          // Якщо база порожня - завантажуємо початкові товари
          await fetch(`${FIREBASE_DB_URL}.json`, {
            method: 'PUT',
            body: JSON.stringify(defaultProducts)
          });
          productsMap = defaultProducts;
        }
        renderProducts();
      } catch (e) {
        console.error("Помилка підключення до Firebase:", e);
        showToast("Помилка завантаження товарів");
      }
    }

    // Синхронізація товарів кожні 3 секунди з усіма пристроями
    setInterval(fetchProductsFromFirebase, 3000);

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      grid.innerHTML = '';

      const productsList = Object.keys(productsMap).map(key => ({
        key: key,
        ...productsMap[key]
      }));

      const filtered = productsList.filter(p => 
        (p.title && p.title.toLowerCase().includes(search)) || 
        (p.desc && p.desc.toLowerCase().includes(search))
      );

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1; padding: 2rem;">Нічого не знайдено</p>';
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${p.image}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/300x200?text=3D+Toy'">
          </div>
          <div class="card-body">
            <h3 class="card-title">${p.title}</h3>
            <p class="card-desc">${p.desc}</p>
            <div class="card-footer">
              <span class="card-price">${p.price} грн</span>
              <button class="btn buy-btn" onclick="addToCart('${p.key}')">В кошик</button>
            </div>
            ${isAdmin ? `
              <div class="admin-card-actions">
                <button class="btn edit-btn" onclick="editProduct('${p.key}')">✏️ Редагувати</button>
                <button class="btn delete-btn" onclick="deleteProduct('${p.key}')">🗑️ Видалити</button>
              </div>
            ` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function addToCart(key) {
      const prod = productsMap[key];
      if (!prod) return;

      const item = cart.find(c => c.id === key);
      if (item) { 
        item.qty += 1; 
      } else { 
        cart.push({ id: key, title: prod.title, price: prod.price, qty: 1 }); 
      }
      saveCart();
      showToast(`Додано в кошик: "${prod.title}"`);
    }

    function updateCartBadge() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cartCount').innerText = count;
    }

    function toggleCart() {
      const modal = document.getElementById('cartModal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
      renderCartItems();
    }

    function renderCartItems() {
      const container = document.getElementById('cartItems');
      container.innerHTML = '';
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 1rem;">Кошик порожній</p>';
        document.getElementById('cartTotalSum').innerText = '0';
        return;
      }

      cart.forEach(item => {
        total += item.price * item.qty;
        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <div>
            <h4>${item.title}</h4>
            <p style="color: var(--text-muted); font-size: 0.85rem;">${item.price} грн x ${item.qty} = ${item.price * item.qty} грн</p>
          </div>
          <div class="cart-item-controls">
            <button onclick="changeQty('${item.id}', -1)">-</button>
            <span>${item.qty}</span>
            <button onclick="changeQty('${item.id}', 1)">+</button>
            <button class="remove-btn" onclick="removeFromCart('${item.id}')">✕</button>
          </div>
        `;
        container.appendChild(div);
      });

      document.getElementById('cartTotalSum').innerText = total;
    }

    function changeQty(id, delta) {
      const item = cart.find(c => c.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
      }
      saveCart();
      renderCartItems();
    }

    function removeFromCart(id) {
      cart = cart.filter(c => c.id !== id);
      saveCart();
      renderCartItems();
    }

    // =========================================================
    // ВІДПРАВКА В TELEGRAM
    // =========================================================
    async function sendOrderToTelegram(e) {
      e.preventDefault();

      if (cart.length === 0) {
        showToast('Ваш кошик порожній!');
        return;
      }

      const submitBtn = document.getElementById('submitOrderBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Надсилання...';

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const contact = document.getElementById('custContact').value.trim() || 'Не вказано';
      const note = document.getElementById('custNote').value.trim() || 'Немає';

      let totalSum = 0;
      let itemsListText = '';

      cart.forEach((item, index) => {
        const itemSum = item.price * item.qty;
        totalSum += itemSum;
        itemsListText += `<b>${index + 1}. ${item.title}</b>\n   └ ${item.qty} шт. × ${item.price} грн = <b>${itemSum} грн</b>\n`;
      });

      const currentDate = new Date().toLocaleString('uk-UA');

      const htmlMessage = `
🛍 <b>НОВЕ ЗАМОВЛЕННЯ 3D-ІГРАШОК!</b>
📅 <i>${currentDate}</i>

👤 <b>Клієнт:</b> ${name}
📞 <b>Телефон:</b> <code>${phone}</code>
💬 <b>Соцмережі:</b> ${contact}
📝 <b>Коментар:</b> ${note}

📦 <b>Склад замовлення:</b>
${itemsListText}
💰 <b>ЗАГАЛЬНА СУМА:</b> <b><u>${totalSum} грн</u></b>
      `.trim();

      try {
        const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: htmlMessage,
            parse_mode: 'HTML'
          })
        });

        const data = await response.json();

        if (data.ok) {
          showToast('🎉 Замовлення успішно відправлено!');
          cart = [];
          saveCart();
          toggleCart();
          document.getElementById('orderForm').reset();
        } else {
          alert('Помилка Telegram API: ' + data.description);
        }
      } catch (err) {
        alert('Помилка з’єднання з інтернетом!');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Надіслати замовлення';
      }
    }

    // =========================================================
    // АДМІНІСТРУВАННЯ ТА СТИСНЕННЯ ФОТО
    // =========================================================
    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const maxWidth = 500;

          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          tempUploadedImage = canvas.toDataURL('image/jpeg', 0.6);

          const preview = document.getElementById('imgPreview');
          preview.src = tempUploadedImage;
          preview.style.display = 'inline-block';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function addNewProduct() {
      const title = document.getElementById('prodName').value.trim();
      const price = parseFloat(document.getElementById('prodPrice').value);
      const desc = document.getElementById('prodDesc').value.trim();
      let image = document.getElementById('prodImg').value.trim();

      if (!title || isNaN(price)) {
        showToast('Вкажіть назву та ціну товару!');
        return;
      }

      const addBtn = document.getElementById('addProdBtn');
      addBtn.disabled = true;
      addBtn.innerText = 'Збереження в базу...';

      if (tempUploadedImage) {
        image = tempUploadedImage;
      } else if (!image) {
        image = 'https://via.placeholder.com/300x200?text=3D+Toy';
      }

      const newKey = 'p_' + Date.now();
      const newProd = { id: newKey, title, price, desc: desc || 'Опис відсутній', image };

      try {
        await fetch(`${FIREBASE_DB_URL}/${newKey}.json`, {
          method: 'PUT',
          body: JSON.stringify(newProd)
        });

        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodDesc').value = '';
        document.getElementById('prodImg').value = '';
        document.getElementById('prodFile').value = '';
        document.getElementById('imgPreview').style.display = 'none';
        tempUploadedImage = '';

        showToast('✅ Товар додано у спільну базу!');
        fetchProductsFromFirebase();
      } catch (e) {
        alert('Помилка відправки в базу даних!');
      } finally {
        addBtn.disabled = false;
        addBtn.innerText = '+ Додати іграшку у каталог';
      }
    }

    async function deleteProduct(key) {
      if (confirm('Видалити цей товар з усіх пристроїв?')) {
        try {
          await fetch(`${FIREBASE_DB_URL}/${key}.json`, { method: 'DELETE' });
          showToast('Товар видалено з бази');
          fetchProductsFromFirebase();
        } catch (e) {
          alert('Помилка видалення з бази');
        }
      }
    }

    async function editProduct(key) {
      const prod = productsMap[key];
      if (!prod) return;

      const newTitle = prompt('Нова назва:', prod.title);
      if (newTitle === null) return;
      const newPrice = prompt('Нова ціна:', prod.price);
      if (newPrice === null) return;
      const newDesc = prompt('Новий опис:', prod.desc);
      if (newDesc === null) return;

      const updatedProd = {
        ...prod,
        title: newTitle.trim() || prod.title,
        price: parseFloat(newPrice) || prod.price,
        desc: newDesc.trim() || prod.desc
      };

      try {
        await fetch(`${FIREBASE_DB_URL}/${key}.json`, {
          method: 'PUT',
          body: JSON.stringify(updatedProd)
        });
        showToast('Товар оновлено в базі');
        fetchProductsFromFirebase();
      } catch (e) {
        alert('Помилка оновлення');
      }
    }

    function updateAdminUI() {
      const panel = document.getElementById('adminPanel');
      const authBtn = document.getElementById('adminAuthBtn');

      if (isAdmin) {
        panel.style.display = 'block';
        authBtn.innerText = '✅ Адмін-режим';
        authBtn.classList.add('active');
      } else {
        panel.style.display = 'none';
        authBtn.innerText = '🔑 Адмін';
        authBtn.classList.remove('active');
      }
      renderProducts();
    }

    function toggleAdminAuth() {
      if (isAdmin) return;
      const pass = prompt('Введіть пароль адміна:');
      if (pass === ADMIN_PASSWORD) {
        isAdmin = true;
        localStorage.setItem('3d_toys_is_admin', 'true');
        updateAdminUI();
        showToast('Вхід успішний!');
      } else if (pass !== null) {
        alert('Невірний пароль!');
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      localStorage.setItem('3d_toys_is_admin', 'false');
      updateAdminUI();
      showToast('Ви вийшли з панелі');
    }

    // Запуск
    updateCartBadge();
    updateAdminUI();
    fetchProductsFromFirebase();
  </script>
</body>
</html>
