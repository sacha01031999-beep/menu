<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин 3D Іграшок</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Шапка -->
  <header>
    <div class="logo">
      <span>3D</span> Toys Store
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Пошук 3D іграшок..." oninput="renderProducts()">
    </div>
    <div class="nav-buttons">
      <button class="cart-btn" onclick="toggleCart()">
        🛒 Кошик (<span id="cartCount">0</span>)
      </button>
      <button class="admin-toggle-btn" id="adminAuthBtn" onclick="toggleAdminAuth()">
        🔑 Вхід для адміна
      </button>
    </div>
  </header>

  <!-- Панель Адміністратора -->
  <div class="admin-panel" id="adminPanel" style="display: none;">
    <div class="admin-header">
      <h2>⚙️ Панель Адміністратора</h2>
      <button class="logout-btn" onclick="logoutAdmin()">Вийти з адмінки</button>
    </div>
    
    <div class="add-product-form">
      <h3>Додати новий товар</h3>
      <div class="form-grid">
        <input type="text" id="prodName" placeholder="Назва іграшки (напр. 3D Дракон)">
        <input type="number" id="prodPrice" placeholder="Ціна (грн)">
        <input type="text" id="prodDesc" placeholder="Короткий опис">
        <input type="text" id="prodImg" placeholder="Посилання на картинку або завантажте файл нижче">
      </div>
      <div class="file-input-wrapper">
        <label for="prodFile">Або виберіть фото з пристрою:</label>
        <input type="file" id="prodFile" accept="image/*" onchange="handleFileUpload(event)">
      </div>
      <button class="add-btn" onclick="addNewProduct()">+ Додати іграшку у каталог</button>
    </div>
  </div>

  <!-- Головний каталог -->
  <main class="container">
    <h1 class="page-title">Каталог 3D Іграшок</h1>
    <div class="products-grid" id="productsGrid">
      <!-- Картки товарів завантажуються через JS -->
    </div>
  </main>

  <!-- Модальне вікно кошика -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Ваш Кошик</h2>
        <button class="close-btn" onclick="toggleCart()">&times;</button>
      </div>
      <div class="cart-items" id="cartItems">
        <!-- Товари кошика -->
      </div>
      <div class="cart-footer">
        <div class="cart-total">
          Всього: <span id="cartTotalSum">0</span> грн
        </div>
        
        <form id="orderForm" onsubmit="sendOrderToTelegram(event)" class="order-form">
          <h3>Оформлення замовлення</h3>
          <input type="text" id="custName" placeholder="Ваше ім'я" required>
          <input type="tel" id="custPhone" placeholder="Номер телефону" required>
          <input type="text" id="custContact" placeholder="Telegram або Viber (необов'язково)">
          <textarea id="custNote" placeholder="Коментар або побажання до колірної гами" rows="2"></textarea>
          
          <button type="submit" class="checkout-btn" id="submitOrderBtn">Надіслати замовлення</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // ВАШІ НАЛАШТУВАННЯ TELEGRAM (ПІДКЛЮЧЕНО)
    // =========================================================
    const TELEGRAM_BOT_TOKEN = '8950609195:AAHKexvKK-aBz0a0Hp7mijJh0JGG6NbWATU';
    const TELEGRAM_CHAT_ID = '5171882196';

    // Пароль Адміністратора
    const ADMIN_PASSWORD = 'sasha_top100';

    // Початкові товари
    const initialProducts = [
      {
        id: 1,
        title: 'Рухомий 3D Дракон',
        price: 350,
        desc: 'Гнучка та деталізована фігурка дракона, роздрукована з шовкового PLA пластику.',
        image: 'https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 2,
        title: '3D Головоломка Куб',
        price: 200,
        desc: 'Цікава антистрес головоломка для розвитку логіки та моторики.',
        image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 3,
        title: 'Забавний 3D Робот',
        price: 280,
        desc: 'Яскрава іграшка-робот із рухомими ручками та ніжками.',
        image: 'https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=600&q=80'
      }
    ];

    let products = JSON.parse(localStorage.getItem('3d_toys_products')) || initialProducts;
    let cart = JSON.parse(localStorage.getItem('3d_toys_cart')) || [];
    let isAdmin = localStorage.getItem('3d_toys_is_admin') === 'true';
    let tempUploadedImage = '';

    function saveProducts() {
      localStorage.setItem('3d_toys_products', JSON.stringify(products));
    }

    function saveCart() {
      localStorage.setItem('3d_toys_cart', JSON.stringify(cart));
      updateCartBadge();
    }

    // Відображення товарів
    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = products.filter(p => p.title.toLowerCase().includes(search) || p.desc.toLowerCase().includes(search));

      if (filtered.length === 0) {
        grid.innerHTML = '<p class="empty-msg">Товарів не знайдено.</p>';
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${p.image}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/300x200?text=3D+Toy'">
          </div>
          <div class="card-body">
            <h3 class="card-title">${p.title}</h3>
            <p class="card-desc">${p.desc}</p>
            <div class="card-footer">
              <span class="card-price">${p.price} грн</span>
              <button class="buy-btn" onclick="addToCart(${p.id})">В кошик</button>
            </div>
            ${isAdmin ? `
              <div class="admin-card-actions">
                <button class="edit-btn" onclick="editProduct(${p.id})">✏️ Редагувати</button>
                <button class="delete-btn" onclick="deleteProduct(${p.id})">🗑️ Видалити</button>
              </div>
            ` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Кошик
    function addToCart(id) {
      const prod = products.find(p => p.id === id);
      const item = cart.find(c => c.id === id);

      if (item) {
        item.qty += 1;
      } else {
        cart.push({ ...prod, qty: 1 });
      }
      saveCart();
      alert(`Товар "${prod.title}" додано до кошика!`);
    }

    function updateCartBadge() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cartCount').innerText = count;
    }

    function toggleCart() {
      const modal = document.getElementById('cartModal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
      renderCartItems();
    }

    function renderCartItems() {
      const container = document.getElementById('cartItems');
      container.innerHTML = '';
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = '<p class="empty-msg">Ваш кошик порожній</p>';
        document.getElementById('cartTotalSum').innerText = '0';
        return;
      }

      cart.forEach(item => {
        total += item.price * item.qty;
        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <div class="cart-item-info">
            <h4>${item.title}</h4>
            <p>${item.price} грн x ${item.qty} = ${item.price * item.qty} грн</p>
          </div>
          <div class="cart-item-controls">
            <button onclick="changeQty(${item.id}, -1)">-</button>
            <span>${item.qty}</span>
            <button onclick="changeQty(${item.id}, 1)">+</button>
            <button class="remove-btn" onclick="removeFromCart(${item.id})">✕</button>
          </div>
        `;
        container.appendChild(div);
      });

      document.getElementById('cartTotalSum').innerText = total;
    }

    function changeQty(id, delta) {
      const item = cart.find(c => c.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) {
          cart = cart.filter(c => c.id !== id);
        }
      }
      saveCart();
      renderCartItems();
    }

    function removeFromCart(id) {
      cart = cart.filter(c => c.id !== id);
      saveCart();
      renderCartItems();
    }

    // =========================================================
    // ВІДПРАВКА ЗАМОВЛЕННЯ В TELEGRAM
    // =========================================================
    async function sendOrderToTelegram(e) {
      e.preventDefault();

      if (cart.length === 0) {
        alert('Ваш кошик порожній!');
        return;
      }

      const submitBtn = document.getElementById('submitOrderBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Надсилання...';

      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      const contact = document.getElementById('custContact').value || 'Не вказано';
      const note = document.getElementById('custNote').value || 'Немає';

      let totalSum = 0;
      let itemsListText = '';

      cart.forEach((item, index) => {
        const itemSum = item.price * item.qty;
        totalSum += itemSum;
        itemsListText += `${index + 1}. *${item.title}* — ${item.qty} шт. x ${item.price} грн = ${itemSum} грн\n`;
      });

      const messageText = `🛒 *НОВЕ ЗАМОВЛЕННЯ 3D-ІГРАШОК!*\n\n` +
        `👤 *Покупець:* ${name}\n` +
        `📞 *Телефон:* ${phone}\n` +
        `💬 *Соцмережі:* ${contact}\n` +
        `📝 *Коментар:* ${note}\n\n` +
        `📦 *Замовлення:*\n${itemsListText}\n` +
        `💰 *Загальна сума:* *${totalSum} грн*`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: messageText,
            parse_mode: 'Markdown'
          })
        });

        const data = await response.json();

        if (data.ok) {
          alert('🎉 Дякуємо! Ваше замовлення успішно відправлено. Ми зв’яжемося з вами найближчим часом!');
          cart = [];
          saveCart();
          toggleCart();
          document.getElementById('orderForm').reset();
        } else {
          alert('Помилка при відправці: ' + data.description + '\nПеревірте, чи ви натиснули /start у боті!');
        }
      } catch (err) {
        alert('Помилка з’єднання. Перевірте підключення до інтернету!');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Надіслати замовлення';
      }
    }

    // =========================================================
    // АДМІНІСТРУВАННЯ
    // =========================================================
    function updateAdminUI() {
      const panel = document.getElementById('adminPanel');
      const authBtn = document.getElementById('adminAuthBtn');

      if (isAdmin) {
        panel.style.display = 'block';
        authBtn.innerText = '✅ Адмін-режим';
        authBtn.classList.add('active');
      } else {
        panel.style.display = 'none';
        authBtn.innerText = '🔑 Вхід для адміна';
        authBtn.classList.remove('active');
      }
      renderProducts();
    }

    function toggleAdminAuth() {
      if (isAdmin) {
        alert('Ви вже в режимі адміністратора!');
        return;
      }

      const pass = prompt('Введіть пароль адміністратора:');
      if (pass === ADMIN_PASSWORD) {
        isAdmin = true;
        localStorage.setItem('3d_toys_is_admin', 'true');
        updateAdminUI();
        alert('Успішний вхід в панель адміна!');
      } else if (pass !== null) {
        alert('Невірний пароль!');
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      localStorage.setItem('3d_toys_is_admin', 'false');
      updateAdminUI();
      alert('Ви вийшли з панелі адміністратора.');
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          tempUploadedImage = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function addNewProduct() {
      const title = document.getElementById('prodName').value.trim();
      const price = parseFloat(document.getElementById('prodPrice').value);
      const desc = document.getElementById('prodDesc').value.trim();
      let image = document.getElementById('prodImg').value.trim();

      if (!title || isNaN(price)) {
        alert('Будь ласка, введіть назву та коректну ціну товару!');
        return;
      }

      if (tempUploadedImage) {
        image = tempUploadedImage;
      } else if (!image) {
        image = 'https://via.placeholder.com/300x200?text=3D+Toy';
      }

      const newProd = {
        id: Date.now(),
        title,
        price,
        desc: desc || 'Опис відсутній',
        image
      };

      products.push(newProd);
      saveProducts();
      renderProducts();

      document.getElementById('prodName').value = '';
      document.getElementById('prodPrice').value = '';
      document.getElementById('prodDesc').value = '';
      document.getElementById('prodImg').value = '';
      document.getElementById('prodFile').value = '';
      tempUploadedImage = '';

      alert('Товар успішно додано!');
    }

    function deleteProduct(id) {
      if (confirm('Ви дійсно хочете видалити цей товар з каталогу?')) {
        products = products.filter(p => p.id !== id);
        saveProducts();
        renderProducts();
      }
    }

    function editProduct(id) {
      const prod = products.find(p => p.id === id);
      if (!prod) return;

      const newTitle = prompt('Нова назва товару:', prod.title);
      if (newTitle === null) return;

      const newPrice = prompt('Нова ціна (грн):', prod.price);
      if (newPrice === null) return;

      const newDesc = prompt('Новий опис:', prod.desc);
      if (newDesc === null) return;

      const newImg = prompt('Нове посилання на картинку:', prod.image);
      if (newImg === null) return;

      prod.title = newTitle.trim() || prod.title;
      prod.price = parseFloat(newPrice) || prod.price;
      prod.desc = newDesc.trim() || prod.desc;
      prod.image = newImg.trim() || prod.image;

      saveProducts();
      renderProducts();
      alert('Товар оновлено!');
    }

    // Старт
    updateCartBadge();
    updateAdminUI();
  </script>
</body>
</html>
